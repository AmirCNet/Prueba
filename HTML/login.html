<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <style>
        body {
            background-color: #b6d4fe;
            margin: 0;
        }

        .login {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
        }

        .hidden {
            display: none;
        }
    </style>
    <title>Login</title>
</head>

<body>

    <div class="d-flex justify-content-center align-items-center vh-100">
        <div class="login">
            <h1 class="text-center mb-4">Iniciar sesión</h1>

            <!-- ¡Aquí empieza el formulario! -->
            <form id="loginForm">

                <!-- Cambié type a "text" y agregué id="userInput" -->
                <p>Usuario:<br>
                    <input type="text" id="userInput" class="form-control" placeholder="Ej: Amir">
                </p>

                <!-- Agregué id="passInput" -->
                <p>Contraseña:<br>
                    <input type="password" id="passInput" class="form-control" placeholder="***********">
                </p>

                <!-- El botón del formulario (type="submit" es importante) -->
                <button type="submit" class="btn btn-primary w-100 mt-4">Iniciar sesión</button>

                <!-- El mensaje de error, inicialmente oculto -->
                <p id="errorMsg" class="text-danger mt-3 hidden">Usuario o contraseña incorrectos.</p>

            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
