<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background-color: #b6d4fe;
        }
        input {
            width: 100%;
            height: 40%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 10px;
        }
        .contenedor{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
        }
        .register{
            background-color: white;
            padding: 30px;
            border-radius: 18px;
            width: 300px;
            text-align: center;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
    <title>Registro</title>
</head>


<body>

<div class="contenedor">
    <div class="register">
        <h1>Crear cuenta</h1>

        <p>Nombre: <input type="text"></p>
        <p>Email: <input type="email"></p>
        <p>Contraseña: <input type="password"></p>

        <button>Registrarse</button>
    </div>
</div>
</body>
</html>
